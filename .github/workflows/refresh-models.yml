name: Refresh model reference

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-model-reference
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Validate updater
        run: python3 -m unittest discover -s tests -v
      - name: Refresh pricing estimates
        run: python3 skills/breadth-first/scripts/refresh_models.py
      - name: Validate generated reference
        run: python3 -m unittest discover -s tests -v
      - name: Commit refreshed reference
        shell: bash
        run: |
          set -euo pipefail
          git add -- skills/breadth-first/references/model-catalog.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore: refresh model pricing reference'
          git push
